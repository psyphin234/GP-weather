<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Unlisted team page: not linked from anywhere, not in any sitemap. -->
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>SAR Weather · Greater Gauteng</title>
  <meta name="theme-color" content="#040817">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="favicon-192x192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>SAR Weather <span class="muted">· Gauteng</span></h1>
    </div>
    <div class="status" role="status">
      <span id="status-text">Loading…</span>
      <button type="button" id="refresh" class="btn small">Refresh</button>
    </div>
    <nav class="jump" aria-label="Panels">
      <a href="#radar">Radar</a><a href="#storm">Storms</a><a href="#points">Areas &amp; tonight</a><a href="#astro">Sun &amp; moon</a>
    </nav>
  </header>

  <main>
    <section class="panel" id="radar" aria-labelledby="radar-h">
      <h2 id="radar-h">Radar</h2>
      <p class="radar-check" id="radar-check" role="note"></p>
      <div id="radar-body"></div>
    </section>

    <section class="panel" id="storm" aria-labelledby="storm-h">
      <h2 id="storm-h">Thunderstorms today</h2>
      <div id="storm-body"></div>
      <div id="storm-images"></div>
    </section>

    <section class="panel" id="points" aria-labelledby="points-h">
      <h2 id="points-h">Areas <span class="h-note" id="night-window"></span></h2>
      <div id="points-body" class="cards"></div>
    </section>

    <section class="panel" id="astro" aria-labelledby="astro-h">
      <h2 id="astro-h">Sun &amp; moon</h2>
      <select id="astro-loc" aria-label="Area for sun and moon times"></select>
      <div id="astro-body"></div>
    </section>
  </main>

  <footer class="foot">
    <p><strong>Planning aid only, not an official forecast.</strong> Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>); radar and TS chart © SAWS via <a href="https://www.flywatch.com/tracking/weather/radar" target="_blank" rel="noopener noreferrer">FlyWatch</a>.</p>
    <noscript><p class="warn">This page needs JavaScript.</p></noscript>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/wx.js"></script>
  <script src="js/refresh.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
