# Publishes the site, plus radar frames and the Gauteng radar mosaic (tools/radar.py),
# on every push and every 15 minutes. Pages source must be "GitHub Actions"
# (Settings > Pages; switched from "Deploy from a branch" on 2026-11-05).
# Nothing is committed: each run reads the last run's frames back from the live
# site.
# The 15-min runs come from cron-job.org (owner's account, set up 2026-11-06):
# POST .../actions/workflows/pages.yml/dispatches {"ref":"main"} at :00/:15/:30/:45
# with a fine-grained token (this repo only, Actions read/write). If that token
# expires the runs stop and cron-job.org emails a failure. GitHub's own schedule
# below is only an hourly backup: it ran 2 times in 17 h when set to every 15 min
# (2026-11-05/06), and it pauses after 60 days without a push (re-enable under
# Actions > this workflow; the cron-job.org runs don't pause).
name: Pages + radar

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Pages sometimes queues a deploy 7-8 min (2026-11-06)
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Site files (everything tracked except the workflow and tools)
        run: |
          mkdir _site
          git ls-files -z | grep -zv -e '^\.github/' -e '^tools/' | xargs -0 cp --parents -t _site
      - name: Radar frames and mosaic
        run: |
          pip install --quiet pillow numpy
          python tools/radar.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Pages refuses a deploy while the previous one is still finishing on its
      # side ("due to in progress deployment", 2026-11-06: a push 2 min after a
      # timed run), so wait and try once more
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
